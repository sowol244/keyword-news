<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>키워드 뉴스</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<style>
:root {
  --blue:#5b7cfa;
  --blue2:#4367ef;
  --blue3:#3154d7;
  --ink:#172033;
  --muted:#6b7280;
  --line:#e7ecf5;
  --soft:#f6f8ff;
  --card:#ffffff;
  --danger:#ef4444;
  --green:#12a36d;
  --shadow:0 18px 45px rgba(39,73,156,.14);
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:linear-gradient(180deg,#eef3ff 0%,#f7f9ff 42%,#f4f6fb 100%);
  color:var(--ink);
  font-size:14px;
}

/* 상단 히어로 */
.header {
  position:relative;
  height:96px;
  padding:0 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  overflow:hidden;
  color:white;
  background:
    radial-gradient(circle at 78% 20%, rgba(255,255,255,.20) 0 92px, transparent 94px),
    radial-gradient(circle at 9% -25%, rgba(255,255,255,.18) 0 120px, transparent 122px),
    linear-gradient(135deg,#6688ff 0%,#5478f7 46%,#4366e8 100%);
  box-shadow:0 16px 42px rgba(67,103,232,.26);
}
.header:after {
  content:"";
  position:absolute;
  right:280px;
  bottom:-54px;
  width:160px;
  height:160px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
}
.brand { position:relative; z-index:1; display:flex; align-items:center; gap:14px; }
.logoMark {
  width:44px; height:44px; border-radius:16px;
  display:grid; place-items:center;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.26);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 12px 22px rgba(18,45,135,.18);
  font-size:24px;
}
.header h1 { font-size:22px; font-weight:800; letter-spacing:-.5px; line-height:1.1; }
.header .hsub { margin-top:5px; font-size:12px; font-weight:500; color:rgba(255,255,255,.78); letter-spacing:.2px; }
.heroCards { position:relative; z-index:1; display:flex; align-items:flex-end; gap:10px; transform:translateY(12px); }
.miniPhone {
  width:92px; height:62px; border-radius:18px 18px 0 0;
  background:rgba(255,255,255,.92);
  box-shadow:0 18px 40px rgba(20,40,100,.25);
  padding:10px;
  opacity:.92;
}
.miniPhone.small { width:72px; height:48px; opacity:.72; transform:translateY(12px); }
.miniLine { height:7px; border-radius:10px; background:#dbe4ff; margin-bottom:7px; }
.miniLine:nth-child(2) { width:70%; background:#edf1ff; }
.miniDot { width:20px; height:20px; border-radius:8px; background:#5b7cfa; margin-left:auto; }

/* PC: 좌우 */
.wrap { display:flex; gap:18px; height:calc(100vh - 96px); padding:18px; }
.side {
  width:306px; min-width:306px;
  background:rgba(255,255,255,.94);
  border:1px solid rgba(231,236,245,.92);
  border-radius:28px;
  overflow-y:auto;
  padding:20px 18px;
  display:flex; flex-direction:column; gap:15px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
}
.main {
  flex:1; min-width:0; overflow:hidden;
  display:flex; flex-direction:column;
  background:rgba(255,255,255,.86);
  border:1px solid rgba(231,236,245,.9);
  border-radius:28px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(10px);
}

/* 공통 */
.stitle { font-size:11px; font-weight:800; color:#7b86a3; text-transform:uppercase; letter-spacing:1px; margin-bottom:9px; }
.row { display:flex; gap:8px; }
.row input, .sw input, .fsel, .pnum {
  border:1px solid #dfe6f3;
  background:#fbfcff;
  color:var(--ink);
  transition:border .15s, box-shadow .15s, background .15s;
}
.row input { flex:1; padding:11px 13px; border-radius:14px; font-size:14px; min-width:0; }
.row input:focus, .sw input:focus, .fsel:focus, .pnum:focus { outline:none; border-color:#7794ff; box-shadow:0 0 0 4px rgba(91,124,250,.12); background:white; }

.btn { padding:9px 14px; border:none; border-radius:13px; cursor:pointer; font-size:13px; font-weight:800; white-space:nowrap; transition:transform .12s, box-shadow .12s, opacity .12s; }
.btn:hover, .bsearch:hover { transform:translateY(-1px); }
.bb { background:linear-gradient(135deg,var(--blue),var(--blue3)); color:white; box-shadow:0 9px 18px rgba(67,103,232,.25); }
.bb:disabled { background:#bfdbfe; cursor:not-allowed; box-shadow:none; transform:none; }
.bd { background:#fff1f2; color:#e11d48; border:1px solid #ffe4e6; }
.bg { background:#10b981; color:white; box-shadow:0 9px 18px rgba(16,185,129,.18); }
.bw { width:100%; }
.bsearch {
  width:100%; padding:15px; font-size:15px; font-weight:900;
  background:linear-gradient(135deg,#5b7cfa,#3154d7);
  color:white; border-radius:18px; border:none; cursor:pointer;
  box-shadow:0 16px 26px rgba(67,103,232,.27);
  transition:transform .12s, box-shadow .12s, opacity .12s;
}
.bsearch:disabled { background:#c7d2fe; cursor:not-allowed; box-shadow:none; transform:none; }
hr { border:none; border-top:1px solid #edf1f8; }

/* 업로드 */
#xlsIn { display:none; }
label[for=xlsIn] {
  display:block; border:1.5px dashed #cad5ee; border-radius:18px; padding:16px 12px;
  text-align:center; cursor:pointer; font-size:12px; color:#7783a0;
  background:linear-gradient(180deg,#fbfcff,#f6f8ff);
  transition:border .15s, background .15s, transform .12s;
}
label[for=xlsIn]:hover { border-color:#5b7cfa; color:#4367ef; background:#f0f4ff; transform:translateY(-1px); }

/* 기간 */
.pbox, .srcbox, .tip, .notice {
  background:#f8faff;
  border:1px solid #e7ecf5;
  border-radius:18px;
  box-shadow:0 1px 2px rgba(15,23,42,.03);
}
.pbox { padding:14px; display:flex; flex-direction:column; gap:12px; }
.period-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.period-label { font-size:12px; font-weight:900; color:#334155; letter-spacing:-.2px; }
.period-chip { font-size:10px; font-weight:900; color:#486be8; background:#eef3ff; border:1px solid #dbe4ff; border-radius:999px; padding:4px 8px; white-space:nowrap; }
.period-grid { display:grid; grid-template-columns:1fr 18px 1fr; align-items:end; gap:6px; }
.period-field { display:flex; flex-direction:column; gap:5px; min-width:0; }
.period-field > span { font-size:10px; font-weight:900; color:#7b879c; padding-left:2px; }
.pinput { display:flex; align-items:center; gap:4px; background:white; border:1px solid #e3e9f5; border-radius:14px; padding:5px 8px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
.pinput:focus-within { border-color:#8ea4ff; box-shadow:0 0 0 3px rgba(91,124,250,.12); }
.pnum { width:38px; padding:4px 0; border:none; background:transparent; border-radius:8px; font-size:14px; text-align:center; font-weight:900; color:#4367ef; }
.pnum:focus { outline:none; }
.pinput em { font-style:normal; font-size:10px; font-weight:800; color:#94a3b8; white-space:nowrap; }
.period-arrow { color:#a6b0c3; font-weight:900; font-size:14px; text-align:center; padding-bottom:8px; }
.period-preview { display:flex; align-items:center; gap:6px; color:#486be8; background:#eef3ff; border:1px solid #dbe4ff; padding:8px 10px; border-radius:14px; font-size:11px; font-weight:900; }
.period-preview strong { font-weight:900; letter-spacing:.1px; }
.quick-periods { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.qp { border:1px solid #dbe4ff; background:#fff; color:#486be8; border-radius:999px; padding:7px 0; font-size:11px; font-weight:900; cursor:pointer; transition:.12s; }
.qp:hover { background:#eef3ff; transform:translateY(-1px); }
.pprev { }
.tip { padding:12px 13px; font-size:11px; color:#2f55c9; line-height:1.85; }
.tip b { font-weight:900; }
.notice { padding:11px 13px; font-size:11px; color:#15803d; background:#f0fdf4; border-color:#c9f4d7; }

/* 검색 출처 */
.srcbox { padding:10px 12px; display:flex; flex-direction:column; gap:7px; }
.srcopt { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 3px; font-size:12px; color:#374151; cursor:pointer; user-select:none; }
.srcopt span { display:flex; align-items:center; gap:8px; }
.srcopt input { width:16px; height:16px; accent-color:#5b7cfa; }
.via { background:#eef3ff; color:#486be8; padding:3px 8px; border-radius:999px; font-size:10px; font-weight:900; border:1px solid #dbe4ff; }

/* 키워드 목록 */
.kwlist { display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto; padding-right:2px; }
.kwitem {
  display:flex; align-items:center; gap:8px;
  background:#f8faff; padding:10px 11px; border-radius:14px; font-size:12px;
  border:1px solid #edf1f8;
}
.kwitem.fail { background:#fff1f2; border-color:#ffe4e6; }
.kwitem .nm { flex:1; word-break:break-all; color:#344054; font-weight:700; }
.kwdel { background:none; border:none; color:#9ca3af; cursor:pointer; font-size:15px; flex-shrink:0; line-height:1; padding:2px 4px; }
.kwdel:hover { color:#dc2626; }

/* 툴바 */
.tbar {
  background:rgba(255,255,255,.92);
  padding:14px 16px;
  border-bottom:1px solid #e7ecf5;
  display:none; flex-direction:column; gap:9px; flex-shrink:0;
}
.tbar.on { display:flex; }
.trow { display:flex; align-items:center; gap:9px; }
.bdg { background:#eef3ff; color:#3558d3; padding:7px 14px; border-radius:999px; font-size:12px; font-weight:900; white-space:nowrap; border:1px solid #dbe4ff; flex-shrink:0; }
.bdgw { background:#fff1f2; color:#e11d48; padding:7px 11px; border-radius:999px; font-size:12px; font-weight:800; cursor:pointer; border:1px solid #ffe4e6; white-space:nowrap; flex-shrink:0; }
.fsel { flex:1; min-width:80px; padding:10px 12px; border-radius:14px; font-size:12px; font-weight:700; }
.ctrlLabel { font-size:11px; font-weight:900; color:#7b86a3; white-space:nowrap; }
.pageCtl { width:106px; flex:0 0 auto; }
.sw { position:relative; flex:1; }
.sw input { width:100%; padding:11px 34px 11px 13px; border-radius:14px; font-size:13px; }
.sx { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; color:#9ca3af; cursor:pointer; font-size:15px; display:none; line-height:1; }

/* 진행 */
.prog { padding:14px 16px; background:white; border-bottom:1px solid #e7ecf5; display:none; flex-shrink:0; }
.pbg { background:#e7ecf5; border-radius:999px; height:9px; overflow:hidden; }
.pbar { background:linear-gradient(90deg,#5b7cfa,#88a2ff); height:9px; border-radius:999px; transition:width 0.3s; width:0%; }
.pinfo { display:flex; justify-content:space-between; margin-top:7px; font-size:12px; color:#66728c; }

/* 뉴스 */
.nlist {
  flex:1;
  overflow-y:auto;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:14px;
  -webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,#f8faff 0%,#f3f6fb 100%);
}
.ncard {
  position:relative;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(215,224,240,.95);
  padding:18px 20px 16px 22px;
  border-radius:22px;
  box-shadow:0 14px 34px rgba(28,45,95,.08);
  overflow:visible;
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
}
.ncard:hover {
  transform:translateY(-2px);
  border-color:#cfdafe;
  box-shadow:0 18px 38px rgba(42,69,146,.12);
}
.ncard:before {
  content:"";
  position:absolute;
  left:0; top:16px; bottom:16px;
  width:5px;
  border-radius:999px;
  background:linear-gradient(180deg,#5b7cfa,#8aa2ff);
}
.ncard a {
  font-size:16px;
  font-weight:900;
  color:#1f2a44;
  text-decoration:none;
  line-height:1.52;
  display:block;
  letter-spacing:-0.04em;
  word-spacing:0;
  word-break:keep-all;
  overflow-wrap:anywhere;
  margin-bottom:11px;
}
.ncard a:hover { color:#3154d7; text-decoration:none; }
.nmeta {
  font-size:12px;
  color:#7a859b;
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  line-height:1.55;
}
.nsrc { color:#475569; font-weight:900; }
.tag {
  background:#f0f4ff;
  color:#4164e2;
  padding:4px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
  border:1px solid #dbe4ff;
}
.hl { background:#fff3a3; border-radius:5px; padding:0 2px; font-weight:900; }
.empty { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; color:#9ca3af; gap:10px; padding:48px 20px; text-align:center; }
.eico { font-size:52px; opacity:0.55; }

/* 페이지 */
.pager { display:none; align-items:center; justify-content:center; gap:7px; padding:12px 14px 16px; background:rgba(255,255,255,.8); border-top:1px solid rgba(226,232,240,.95); flex-shrink:0; flex-wrap:wrap; }
.pager.on { display:flex; }
.pgbtn { min-width:34px; height:34px; border:none; border-radius:12px; background:#f1f5ff; color:#52617a; font-weight:900; cursor:pointer; padding:0 10px; }
.pgbtn:hover:not(:disabled) { background:#e5ecff; color:#3154d7; }
.pgbtn.on { background:#5b7cfa; color:white; box-shadow:0 8px 16px rgba(91,124,250,.25); }
.pgbtn:disabled { opacity:.48; cursor:default; }
.pginfo { font-size:11px; color:#7b86a3; font-weight:800; margin-left:3px; }

/* 모바일: 기존 구조 유지 */
@media (max-width:768px) {
  .header { height:82px; padding:0 18px; }
  .header h1 { font-size:19px; }
  .header .hsub { font-size:11px; }
  .logoMark { width:40px; height:40px; border-radius:14px; }
  .heroCards { display:none; }
  .wrap { flex-direction:column; height:auto; overflow:visible; padding:12px; gap:12px; min-height:100vh; }
  .side { width:100%; min-width:unset; border-right:none; border-bottom:none; max-height:none; border-radius:24px; }
  .kwlist { max-height:160px; }
  .main { height:auto; min-height:60vh; overflow:visible; border-radius:24px; }
  .nlist { height:auto; min-height:50vh; overflow-y:visible; padding:12px; gap:10px; }
  .ncard { border-radius:18px; padding:15px 15px 14px 18px; box-shadow:0 8px 22px rgba(28,45,95,.07); }
  .ncard:before { top:14px; bottom:14px; width:4px; }
  .ncard a { font-size:14.5px; line-height:1.48; margin-bottom:9px; letter-spacing:-0.03em; }
  .nmeta { font-size:11px; gap:5px; }
  .tag, .via { font-size:10px; padding:3px 7px; }
  .trow { flex-wrap:wrap; }
  .sw { flex-basis:100%; }
  .fsel { min-width:0; }
  .pageCtl { width:auto; min-width:92px; flex:1; }
  .pager { padding-bottom:18px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="logoMark">📰</div>
    <div>
      <h1>키워드 뉴스 모니터</h1>
      <div class="hsub">뉴스 검색 · 출처 필터 · 엑셀 저장</div>
    </div>
  </div>
  <div class="heroCards" aria-hidden="true">
    <div class="miniPhone small"><div class="miniLine"></div><div class="miniLine"></div></div>
    <div class="miniPhone"><div class="miniLine"></div><div class="miniLine"></div><div class="miniDot"></div></div>
    <div class="miniPhone small"><div class="miniLine"></div><div class="miniLine"></div></div>
  </div>
</div>

<div class="wrap">
  <!-- 사이드바 -->
  <div class="side" id="side">

    <div>
      <div class="stitle">키워드 등록 <span id="kwCnt">0</span>/100</div>
      <div class="row" style="margin-top:8px">
        <input type="text" id="kwIn" placeholder="키워드 입력 후 엔터" onkeydown="if(event.key==='Enter')addKw()">
        <button class="btn bb" onclick="addKw()">추가</button>
      </div>
    </div>

    <div class="notice">💾 키워드는 <b>브라우저에 자동 저장</b>됩니다</div>

    <div class="tip">
      💡 <b>검색 팁</b><br>
      띄어쓰기 → <b>AND</b> 자동 처리 &nbsp;예) <b>충남 교육청</b><br>
      OR 3개 이상 가능 &nbsp;예) <b>A OR B OR C</b>
    </div>

    <hr>

    <div>
      <div class="stitle">📂 엑셀 업로드</div>
      <label for="xlsIn" style="margin-top:8px">
        📁 클릭하여 엑셀 파일 선택<br>
        <span style="font-size:11px;opacity:0.7;margin-top:3px;display:block">첫 번째 열에 키워드 · 최대 100개</span>
      </label>
      <input type="file" id="xlsIn" accept=".xlsx,.xls" onchange="uploadXls(this)">
    </div>

    <hr>

    <div>
      <div class="stitle">📅 기간 설정</div>
      <div class="pbox" style="margin-top:8px">
        <div class="period-head">
          <span class="period-label">검색 기간</span>
          <span class="period-chip">오늘 기준</span>
        </div>
        <div class="period-grid">
          <label class="period-field">
            <span>종료</span>
            <div class="pinput">
              <input type="number" class="pnum" id="dFrom" value="0" min="0" max="365" oninput="updatePrev()">
              <em>일 전</em>
            </div>
          </label>
          <span class="period-arrow">~</span>
          <label class="period-field">
            <span>시작</span>
            <div class="pinput">
              <input type="number" class="pnum" id="dTo" value="7" min="0" max="365" oninput="updatePrev()">
              <em>일 전</em>
            </div>
          </label>
        </div>
        <div class="quick-periods">
          <button type="button" class="qp" onclick="setPeriod(0,0)">오늘</button>
          <button type="button" class="qp" onclick="setPeriod(0,7)">7일</button>
          <button type="button" class="qp" onclick="setPeriod(0,30)">30일</button>
        </div>
        <div class="period-preview"><span>📅</span><strong id="pprev"></strong></div>
      </div>
    </div>

    <hr>

    <div>
      <div class="stitle">🔎 검색 출처</div>
      <div class="srcbox" style="margin-top:8px">
        <label class="srcopt"><span><input type="checkbox" id="srcGoogle" checked onchange="onSourceChange()"> 구글 뉴스 RSS</span><b class="via">Google</b></label>
        <label class="srcopt"><span><input type="checkbox" id="srcNaver" checked onchange="onSourceChange()"> 네이버 뉴스 API</span><b class="via">Naver</b></label>
      </div>
    </div>

    <hr>
    <button class="bsearch" id="schBtn" onclick="startSearch()">🔍 뉴스 검색</button>
    <hr>

    <div>
      <div class="stitle">등록된 키워드</div>
      <div class="kwlist" id="kwList" style="margin-top:8px"></div>
    </div>

    <button class="btn bd bw" onclick="clearAll()">🗑️ 전체 초기화</button>

  </div>

  <!-- 메인 -->
  <div class="main">
    <div class="tbar" id="tbar">
      <div class="trow">
        <span class="bdg" id="cntBdg">0건</span>
        <button class="bdgw" id="failBdg" style="display:none" onclick="retryFail()"></button>
        <select id="kwFilter" class="fsel" onchange="curPage=1;render()">
          <option value="">전체 키워드 (중복 제거)</option>
        </select>
        <button class="btn bg" onclick="dlExcel()" style="flex-shrink:0;padding:7px 11px;font-size:12px">📥 저장</button>
      </div>
      <div class="trow">
        <div class="sw">
          <input type="text" id="srchIn" placeholder="🔎 결과 내 검색 (제목·언론사)" oninput="onSrch()">
          <button class="sx" id="srchX" onclick="clrSrch()">✕</button>
        </div>
        <span class="ctrlLabel">페이지</span>
        <select id="pageSize" class="fsel pageCtl" onchange="onPageSizeChange()">
          <option value="10">10개씩</option>
          <option value="30" selected>30개씩</option>
          <option value="100">100개씩</option>
          <option value="all">전체</option>
        </select>
      </div>
    </div>

    <div class="prog" id="prog">
      <div class="pbg"><div class="pbar" id="pbar"></div></div>
      <div class="pinfo">
        <span id="ptxt">검색 준비 중...</span>
        <span id="ppct" style="font-weight:700;color:#2563eb">0%</span>
      </div>
    </div>

    <div class="nlist" id="nlist">
      <div class="empty"><div class="eico">📋</div><p>키워드를 등록하고<br>검색 버튼을 누르세요</p></div>
    </div>
    <div class="pager" id="pager"></div>
  </div>
</div>

<script>
var WORKER = 'https://news-proxy.whizboy.workers.dev';
var SK = 'kw_news_v1';
var keywords = [], allNews = [], failKws = [], kwSt = {};
var curPage = 1;

function sleep(ms) { return new Promise(function(r){ setTimeout(r,ms); }); }

function fetchTO(url, ms) {
  return new Promise(function(resolve, reject) {
    var t = setTimeout(function(){ reject(new Error('timeout')); }, ms);
    fetch(url).then(function(r){ clearTimeout(t); resolve(r); }).catch(function(e){ clearTimeout(t); reject(e); });
  });
}

function saveKw() { try { localStorage.setItem(SK, JSON.stringify(keywords)); } catch(e) {} }
function loadKw() { try { var s=localStorage.getItem(SK); if(s) keywords=JSON.parse(s); } catch(e) {} }

function updatePrev() {
  var f=parseInt(document.getElementById('dFrom').value)||0;
  var t=parseInt(document.getElementById('dTo').value)||0;
  var d1=new Date(); d1.setDate(d1.getDate()-t);
  var d2=new Date(); d2.setDate(d2.getDate()-f);
  var fmt=function(d){ return d.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}); };
  document.getElementById('pprev').textContent=fmt(d1)+' ~ '+fmt(d2);
}

function setPeriod(from, to) {
  document.getElementById('dFrom').value = from;
  document.getElementById('dTo').value = to;
  updatePrev();
}

function procKw(raw) {
  if (/\b(OR|AND)\b/.test(raw)) return raw;
  return raw.trim().split(/\s+/).filter(Boolean).join(' AND ');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function hlText(text, q) {
  if (!q) return esc(text);
  var re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  return esc(text).replace(re, function(m){ return '<span class="hl">'+m+'</span>'; });
}

function renderKwList() {
  document.getElementById('kwCnt').textContent = keywords.length;
  var h='';
  for (var i=0; i<keywords.length; i++) {
    var kw=keywords[i], st=kwSt[kw]||'';
    var ic=st==='ok'?'✅':st==='fail'?'❌':st==='pending'?'⏳':'';
    h+='<div class="kwitem'+(st==='fail'?' fail':'')+'">'+
       '<span class="nm">'+esc(kw)+'</span><span>'+ic+'</span>'+
       '<button class="kwdel" onclick="delKw('+i+')">✕</button></div>';
  }
  document.getElementById('kwList').innerHTML = h;
}

function addKw() {
  var inp=document.getElementById('kwIn');
  var raw=inp.value.trim(); if(!raw) return;
  var kw=procKw(raw);
  if(keywords.indexOf(kw)>=0){alert('이미 등록된 키워드입니다.');return;}
  if(keywords.length>=100){alert('최대 100개까지 등록 가능합니다.');return;}
  keywords.push(kw); inp.value='';
  saveKw(); renderKwList();
}

function delKw(i) { keywords.splice(i,1); saveKw(); renderKwList(); }

function clearAll() {
  if(!confirm('전체 초기화하시겠습니까?')) return;
  keywords=[]; allNews=[]; failKws=[]; kwSt={};
  saveKw(); renderKwList();
  document.getElementById('tbar').classList.remove('on');
  var pg=document.getElementById('pager'); if(pg){pg.classList.remove('on');pg.innerHTML='';}
  document.getElementById('nlist').innerHTML='<div class="empty"><div class="eico">📋</div><p>키워드를 등록하고<br>검색 버튼을 누르세요</p></div>';
}

function uploadXls(input) {
  var file=input.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try {
      var wb=XLSX.read(e.target.result,{type:'binary'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1});
      var added=0;
      for(var i=0;i<rows.length;i++){
        var raw=String(rows[i][0]||'').trim();
        if(!raw) continue;
        var kw=procKw(raw);
        if(keywords.indexOf(kw)<0&&keywords.length<100){keywords.push(kw);added++;}
      }
      saveKw(); renderKwList();
      alert(added+'개 키워드가 추가되었습니다.');
    } catch(err) { alert('파일 오류: '+err.message); }
  };
  reader.readAsBinaryString(file);
  input.value='';
}

function onSrch() {
  var v=document.getElementById('srchIn').value;
  document.getElementById('srchX').style.display=v?'block':'none';
  curPage = 1;
  render();
}
function clrSrch() {
  document.getElementById('srchIn').value='';
  document.getElementById('srchX').style.display='none';
  curPage = 1;
  render();
}

function getCuts() {
  var f=parseInt(document.getElementById('dFrom').value)||0;
  var t=parseInt(document.getElementById('dTo').value)||7;
  var s=new Date(); s.setDate(s.getDate()-t); s.setHours(0,0,0,0);
  var e=new Date(); e.setDate(e.getDate()-f); e.setHours(23,59,59,999);
  return {s:s,e:e};
}

function getSources() {
  return {
    google: document.getElementById('srcGoogle').checked,
    naver: document.getElementById('srcNaver').checked
  };
}

function onSourceChange() {
  curPage = 1;
  render();
}

function sourceAllowed(n) {
  var src = getSources();
  var via = String(n.via || '');
  return (src.google && via.indexOf('Google RSS') >= 0) ||
         (src.naver && via.indexOf('Naver API') >= 0);
}

function getFilteredNews() {
  var fk = document.getElementById('kwFilter').value;
  var q = document.getElementById('srchIn').value.trim();
  var news = allNews.filter(sourceAllowed);
  if (fk) news = news.filter(function(n){ return n.keywords.indexOf(fk) >= 0; });
  if (q) {
    var ql = q.toLowerCase();
    news = news.filter(function(n){
      return n.title.toLowerCase().indexOf(ql) >= 0 ||
             n.source.toLowerCase().indexOf(ql) >= 0 ||
             String(n.via || '').toLowerCase().indexOf(ql) >= 0;
    });
  }
  return news;
}

function getPageSize() {
  var el = document.getElementById('pageSize');
  if (!el || el.value === 'all') return 'all';
  return parseInt(el.value, 10) || 30;
}

function onPageSizeChange() {
  curPage = 1;
  render();
}

function pageBtn(label, page, disabled, active) {
  if (label === '...') return '<span class="pgdots">...</span>';
  return '<button class="pgbtn'+(active?' on':'')+'" '+(disabled?'disabled':'')+' onclick="goPage('+page+')">'+label+'</button>';
}

function goPage(p) {
  curPage = p;
  render();
  var box = document.getElementById('nlist');
  if (box && box.scrollTo) box.scrollTo({top:0, behavior:'smooth'});
}

function renderPager(total, pageSize, totalPages) {
  var pager = document.getElementById('pager');
  if (!pager) return;
  if (total === 0 || pageSize === 'all' || totalPages <= 1) {
    pager.classList.remove('on');
    pager.innerHTML = '';
    return;
  }
  var h = '';
  h += pageBtn('‹', Math.max(1, curPage-1), curPage === 1, false);
  var pages = [];
  function add(p){ if(p>=1 && p<=totalPages && pages.indexOf(p)<0) pages.push(p); }
  add(1); add(2);
  for (var i=curPage-2; i<=curPage+2; i++) add(i);
  add(totalPages-1); add(totalPages);
  pages.sort(function(a,b){return a-b;});
  var prev = 0;
  for (var j=0; j<pages.length; j++) {
    if (prev && pages[j] - prev > 1) h += pageBtn('...', 0, true, false);
    h += pageBtn(String(pages[j]), pages[j], false, pages[j] === curPage);
    prev = pages[j];
  }
  h += pageBtn('›', Math.min(totalPages, curPage+1), curPage === totalPages, false);
  var from = (curPage - 1) * pageSize + 1;
  var to = Math.min(total, curPage * pageSize);
  h += '<div class="pginfo">'+from+'-'+to+' / 총 '+total+'건</div>';
  pager.innerHTML = h;
  pager.classList.add('on');
}

function cleanHtml(s) {
  return String(s || '')
    .replace(/<[^>]+>/g, '')
    .replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'")
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .trim();
}

function getHostName(link) {
  try {
    var u = new URL(link);
    return u.hostname.replace(/^www\./, '');
  } catch(e) { return ''; }
}

var PRESS_MAP = {
  'yna.co.kr':'연합뉴스',
  'newsis.com':'뉴시스',
  'news1.kr':'뉴스1',
  'kbs.co.kr':'KBS',
  'imbc.com':'MBC',
  'sbs.co.kr':'SBS',
  'ytn.co.kr':'YTN',
  'chosun.com':'조선일보',
  'joongang.co.kr':'중앙일보',
  'donga.com':'동아일보',
  'hani.co.kr':'한겨레',
  'khan.co.kr':'경향신문',
  'daejonilbo.com':'대전일보',
  'joongdo.co.kr':'중도일보',
  'cctoday.co.kr':'충청투데이',
  'dtnews24.com':'디트뉴스24',
  'goodmorningcc.com':'굿모닝충청',
  'ccnnews.co.kr':'충청뉴스',
  'ccdailynews.com':'충청일보',
  'chungnamilbo.co.kr':'충남일보'
};

function getPressName(link, fallback) {
  var host = getHostName(link);
  return PRESS_MAP[host] || fallback || host || '언론사 미상';
}

function makeNewsKey(n) {
  var link = String(n.link || '').split('#')[0].split('?')[0];
  if (link) return link;
  return cleanHtml(n.title).replace(/\s+/g,' ').toLowerCase() + '|' + String(n.source || '').toLowerCase();
}

function fetchRSS(kw,cs,ce) {
  var rss='https://news.google.com/rss/search?q='+encodeURIComponent(kw)+'&hl=ko&gl=KR&ceid=KR:ko';
  var url=WORKER+'?url='+encodeURIComponent(rss);
  return fetchTO(url,12000).then(function(res){
    if(!res.ok) return null;
    return res.text().then(function(xml){
      if(xml.indexOf('<item>')<0) return [];
      var doc=new DOMParser().parseFromString(xml,'text/xml');
      var out=[];
      doc.querySelectorAll('item').forEach(function(item){
        var title=(item.querySelector('title')||{}).textContent||'';
        var link=(item.querySelector('link')||{}).textContent||'';
        var pub=(item.querySelector('pubDate')||{}).textContent||'';
        var src=(item.querySelector('source')||{}).textContent||'';
        var date=pub?new Date(pub):new Date(0);
        if(date<cs||date>ce) return;
        out.push({title:title.replace(/ - [^-]+$/,'').trim(),link:link,source:src,date:date,
          dateStr:date.toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),
          keywords:[], via:'Google RSS'});
      });
      return out;
    });
  }).catch(function(){ return null; });
}

function fetchNaverPage(kw, cs, ce, start) {
  var url = WORKER + '/naver?query=' + encodeURIComponent(kw) + '&display=100&start=' + start + '&sort=date';
  return fetchTO(url, 12000).then(function(res) {
    if (!res.ok) return null;
    return res.json().then(function(data) {
      var out = [];
      var items = data.items || [];
      for (var i=0; i<items.length; i++) {
        var item = items[i];
        var title = cleanHtml(item.title);
        var link = item.originallink || item.link || '';
        var pub = item.pubDate || '';
        var date = pub ? new Date(pub) : new Date(0);
        if (date < cs || date > ce) continue;
        out.push({
          title: title,
          link: link,
          source: getPressName(link, '네이버뉴스'),
          date: date,
          dateStr: date.toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),
          keywords: [],
          via: 'Naver API'
        });
      }
      return {items: out, rawCount: items.length};
    });
  }).catch(function(){ return null; });
}

async function fetchNaver(kw, cs, ce) {
  var starts = [1, 101, 201];
  var merged = [];
  for (var i=0; i<starts.length; i++) {
    var page = await fetchNaverPage(kw, cs, ce, starts[i]);
    if (page === null) return null;
    merged = merged.concat(page.items);
    if (page.rawCount < 100) break;
    await sleep(120);
  }
  return merged;
}

async function runSearch(kwList) {
  var cuts=getCuts(), map=new Map(), done=0;
  var src=getSources();
  for(var i=0;i<allNews.length;i++) map.set(allNews[i].link,allNews[i]);
  for(var i=0;i<kwList.length;i++){
    var kw=kwList[i];
    kwSt[kw]='pending'; renderKwList();
    var items=[];
    var failed=0, tried=0;

    if(src.google){
      tried++;
      var rssItems=await fetchRSS(kw,cuts.s,cuts.e);
      if(rssItems===null) failed++; else items=items.concat(rssItems);
    }

    if(src.naver){
      tried++;
      var naverItems=await fetchNaver(kw,cuts.s,cuts.e);
      if(naverItems===null) failed++; else items=items.concat(naverItems);
    }

    done++;
    var pct=Math.round(done/kwList.length*100);
    document.getElementById('pbar').style.width=pct+'%';
    document.getElementById('ptxt').textContent='완료: '+done+'/'+kwList.length+'개';
    document.getElementById('ppct').textContent=pct+'%';
    if(tried===0 || failed===tried){kwSt[kw]='fail';failKws.push(kw);}
    else{
      kwSt[kw]='ok';
      for(var j=0;j<items.length;j++){
        var it=items[j];
        var key=makeNewsKey(it);
        if(map.has(key)){
          var ex=map.get(key);
          if(ex.keywords.indexOf(kw)<0) ex.keywords.push(kw);
          if(ex.via.indexOf(it.via)<0) ex.via += ', ' + it.via;
        }
        else{it.keywords=[kw];map.set(key,it);}
      }
    }
    renderKwList();
    await sleep(200);
  }
  return map;
}

async function startSearch() {
  if(keywords.length===0){alert('키워드를 먼저 등록해주세요.');return;}
  var src=getSources();
  if(!src.google && !src.naver){alert('검색 출처를 하나 이상 선택해주세요.');return;}
  document.getElementById('schBtn').disabled=true;
  document.getElementById('prog').style.display='block';
  document.getElementById('tbar').classList.remove('on');
  var pg=document.getElementById('pager'); if(pg){pg.classList.remove('on');pg.innerHTML='';}
  document.getElementById('nlist').innerHTML='';
  document.getElementById('pbar').style.width='0%';
  kwSt={}; allNews=[]; failKws=[]; curPage=1;
  var map=await runSearch(keywords);
  allNews=Array.from(map.values()).sort(function(a,b){return b.date-a.date;});
  finish();
}

async function retryFail() {
  if(!failKws.length) return;
  var list=failKws.slice(); failKws=[];
  document.getElementById('schBtn').disabled=true;
  document.getElementById('prog').style.display='block';
  document.getElementById('failBdg').style.display='none';
  document.getElementById('pbar').style.width='0%';
  var map=await runSearch(list);
  allNews=Array.from(map.values()).sort(function(a,b){return b.date-a.date;});
  finish();
}

function finish() {
  document.getElementById('prog').style.display='none';
  document.getElementById('schBtn').disabled=false;
  var sel=document.getElementById('kwFilter');
  var opts='<option value="">전체 키워드 (중복 제거)</option>';
  for(var i=0;i<keywords.length;i++) opts+='<option value="'+esc(keywords[i])+'">'+esc(keywords[i])+'</option>';
  sel.innerHTML=opts;
  document.getElementById('tbar').classList.add('on');
  var fb=document.getElementById('failBdg');
  if(failKws.length>0){fb.style.display='';fb.textContent='❌ '+failKws.length+'개 실패 — 재시도';}
  else fb.style.display='none';
  clrSrch(); render();
}

function render() {
  var q=document.getElementById('srchIn').value.trim();
  var news=getFilteredNews();
  document.getElementById('cntBdg').textContent=news.length+'건';
  if(news.length===0){
    document.getElementById('nlist').innerHTML='<div class="empty"><div class="eico">🔍</div><p>검색 결과가 없습니다</p></div>';
    renderPager(0,'all',0);
    return;
  }

  var pageSize = getPageSize();
  var totalPages = pageSize === 'all' ? 1 : Math.max(1, Math.ceil(news.length / pageSize));
  if (curPage > totalPages) curPage = totalPages;
  if (curPage < 1) curPage = 1;
  var view = news;
  if (pageSize !== 'all') {
    var st = (curPage - 1) * pageSize;
    view = news.slice(st, st + pageSize);
  }

  var h='';
  for(var i=0;i<view.length;i++){
    var n=view[i];
    var tags=n.keywords.map(function(k){return '<span class="tag">'+esc(k)+'</span>';}).join(' ');
    h+='<div class="ncard"><a href="'+n.link+'" target="_blank">'+hlText(n.title,q)+'</a>'+ 
       '<div class="nmeta"><span class="nsrc">📰 '+esc(n.source)+'</span><span>·</span><span>🕒 '+n.dateStr+'</span><span>·</span><span class="via">'+esc(n.via||'')+'</span><span>·</span>'+tags+'</div></div>';
  }
  document.getElementById('nlist').innerHTML=h;
  renderPager(news.length, pageSize, totalPages);
}

function dlExcel() {
  var news=getFilteredNews();
  var rows=[['제목','언론사','날짜','링크','키워드','수집경로']];
  news.forEach(function(n){rows.push([n.title,n.source,n.dateStr,n.link,n.keywords.join(', '),n.via||'']);});
  var ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:60},{wch:20},{wch:20},{wch:80},{wch:30},{wch:18}];
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'뉴스결과');
  XLSX.writeFile(wb,'키워드뉴스결과.xlsx');
}

loadKw(); renderKwList(); updatePrev();
</script>
</body>
</html>
